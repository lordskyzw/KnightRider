name: knight_rider_mobile
description: "Knight Rider mobile dashboard + courier client."
publish_to: 'none'
version: 0.14.0+25

environment:
  sdk: ^3.10.4

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # Networking
  web_socket_channel: ^3.0.0
  http: ^1.2.0

  # Local storage (backlog buffer)
  sqflite: ^2.3.3
  path_provider: ^2.1.4
  path: ^1.9.0
  shared_preferences: ^2.3.0

  # Build/version info so the dashboard can show what APK is running
  package_info_plus: ^8.0.0

  # SVG rendering for the car silhouette + future per-vehicle assets
  flutter_svg: ^2.0.0

  # Rotatable 3D car model in the dashboard centre (glTF/GLB via <model-viewer>).
  # Behind a feature flag; SVG is the fallback when 3D is off or the model fails.
  model_viewer_plus: ^1.9.0

  # Used directly for the WebViewController type so CarModel3D can push live
  # appearance/lamp updates via runJavaScript (no reload). Already a transitive
  # dep of model_viewer_plus; pinned here so the import is first-class.
  webview_flutter: ^4.0.0

  # Timestamp formatting on the batches/DTC drill-down screens
  intl: ^0.20.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

  # Generates launcher icons (all densities + adaptive) from a source PNG.
  # Build-time only; regenerate with `dart run flutter_launcher_icons`.
  flutter_launcher_icons: ^0.14.1

flutter:
  uses-material-design: true

  assets:
    - assets/cars/

# Source art lives in assets/icon/ (see tool/gen_icon.py) but is NOT bundled
# at runtime — it's only an input to icon generation.
flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/icon.png"
  adaptive_icon_background: "#0A0A0B"
  adaptive_icon_foreground: "assets/icon/icon_foreground.png"
  min_sdk_android: 21
  remove_alpha_ios: true
