name: knight_rider_mobile
description: "Knight Rider mobile dashboard + courier client."
publish_to: 'none'
version: 0.2.0+2

environment:
  sdk: ^3.10.4

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # Networking
  web_socket_channel: ^3.0.0
  http: ^1.2.0

  # Local storage (backlog buffer)
  sqflite: ^2.3.3
  path_provider: ^2.1.4
  path: ^1.9.0
  shared_preferences: ^2.3.0

  # Build/version info so the dashboard can show what APK is running
  package_info_plus: ^8.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
