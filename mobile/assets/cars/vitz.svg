<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 100 180" xmlns="http://www.w3.org/2000/svg" aria-label="Toyota Vitz NSP130 top-down silhouette">
  <!-- Body shadow -->
  <ellipse cx="50" cy="172" rx="40" ry="3" fill="#000000" opacity="0.35"/>

  <!-- Outer body — slightly tapered hatchback -->
  <path d="
      M 32,4
      Q 50,1 68,4
      Q 80,8 86,18
      L 91,40
      Q 93,90 92,130
      L 88,160
      Q 80,174 68,176
      Q 50,179 32,176
      Q 20,174 12,160
      L 8,130
      Q 7,90 9,40
      Q 15,8 32,4 Z"
      fill="#1F2024" stroke="#3A3B3F" stroke-width="1.2"/>

  <!-- Front bumper subtle highlight -->
  <path d="M 28,6 Q 50,3 72,6 L 80,12 L 20,12 Z" fill="#272828"/>

  <!-- Hood split line -->
  <line x1="20" y1="34" x2="80" y2="34" stroke="#3A3B3F" stroke-width="0.6"/>

  <!-- Windscreen / front roof / rear roof / hatch — cabin glass area -->
  <path d="
      M 23,42
      Q 28,40 50,40 Q 72,40 77,42
      L 81,52
      Q 83,90 82,130
      L 78,144
      Q 72,148 50,148 Q 28,148 22,144
      L 18,130
      Q 17,90 19,52 Z"
      fill="#0A0A0B" stroke="#3A3B3F" stroke-width="0.8"/>

  <!-- Windscreen rake line -->
  <line x1="23" y1="52" x2="77" y2="52" stroke="#3A3B3F" stroke-width="0.6"/>
  <!-- Rear window rake line -->
  <line x1="22" y1="138" x2="78" y2="138" stroke="#3A3B3F" stroke-width="0.6"/>
  <!-- Roof centreline (subtle) -->
  <line x1="50" y1="52" x2="50" y2="138" stroke="#2A2B2F" stroke-width="0.4" stroke-dasharray="2 3"/>

  <!-- Toyota emblem hint on the hood -->
  <ellipse cx="50" cy="22" rx="4" ry="2.5" fill="none" stroke="#3A3B3F" stroke-width="0.7"/>
  <ellipse cx="50" cy="22" rx="1.7" ry="2.4" fill="none" stroke="#3A3B3F" stroke-width="0.5"/>

  <!-- Headlights -->
  <path d="M 18,12 Q 26,8 36,10 L 36,18 Q 26,16 18,20 Z" fill="#F0F0F2" opacity="0.55"/>
  <path d="M 82,12 Q 74,8 64,10 L 64,18 Q 74,16 82,20 Z" fill="#F0F0F2" opacity="0.55"/>

  <!-- Foglight dots -->
  <circle cx="28" cy="14" r="1.2" fill="#F0F0F2" opacity="0.35"/>
  <circle cx="72" cy="14" r="1.2" fill="#F0F0F2" opacity="0.35"/>

  <!-- Tail lights -->
  <path d="M 17,166 Q 22,170 36,170 L 36,176 Q 22,176 13,172 Z" fill="#C8102E" opacity="0.75"/>
  <path d="M 83,166 Q 78,170 64,170 L 64,176 Q 78,176 87,172 Z" fill="#C8102E" opacity="0.75"/>

  <!-- Side mirrors -->
  <circle cx="13" cy="58" r="3.2" fill="#272828" stroke="#3A3B3F" stroke-width="0.6"/>
  <circle cx="87" cy="58" r="3.2" fill="#272828" stroke="#3A3B3F" stroke-width="0.6"/>

  <!-- Door handles (subtle marks on the cabin sides) -->
  <line x1="19" y1="78"  x2="19" y2="82"  stroke="#3A3B3F" stroke-width="0.7"/>
  <line x1="81" y1="78"  x2="81" y2="82"  stroke="#3A3B3F" stroke-width="0.7"/>
  <line x1="19" y1="108" x2="19" y2="112" stroke="#3A3B3F" stroke-width="0.7"/>
  <line x1="81" y1="108" x2="81" y2="112" stroke="#3A3B3F" stroke-width="0.7"/>

  <!-- Wheels -->
  <rect x="2"  y="32"  width="9" height="22" rx="3" fill="#2A2B2F" stroke="#3A3B3F" stroke-width="0.6"/>
  <rect x="89" y="32"  width="9" height="22" rx="3" fill="#2A2B2F" stroke="#3A3B3F" stroke-width="0.6"/>
  <rect x="2"  y="126" width="9" height="22" rx="3" fill="#2A2B2F" stroke="#3A3B3F" stroke-width="0.6"/>
  <rect x="89" y="126" width="9" height="22" rx="3" fill="#2A2B2F" stroke="#3A3B3F" stroke-width="0.6"/>
</svg>
