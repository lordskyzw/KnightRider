workflows:
  ios-unsigned-dev:
    name: iOS Unsigned Dev Build
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      flutter: stable
      xcode: latest
    scripts:
      - name: Flutter version
        script: flutter --version
      - name: Flutter pub get
        working_directory: mobile
        script: flutter pub get
      - name: Build iOS (unsigned)
        working_directory: mobile
        script: flutter build ios --release --no-codesign
      - name: Package unsigned IPA for sideloading
        working_directory: mobile
        script: |
          set -euo pipefail
          OUT=build/ios/ipa
          rm -rf "$OUT" && mkdir -p "$OUT/Payload"
          cp -R build/ios/iphoneos/Runner.app "$OUT/Payload/"
          (cd "$OUT" && zip -qr KnightRider-unsigned.ipa Payload)
          ls -lh "$OUT/KnightRider-unsigned.ipa"
    artifacts:
      - mobile/build/ios/ipa/KnightRider-unsigned.ipa
      - mobile/build/ios/iphoneos/Runner.app
